{% extends 'store/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Edit Product</h2>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                <input type="text" name="name" value="{{ product.name }}" required
                    class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select name="category" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if product.category.id == cat.id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price (₱/kg)</label>
                    <input type="number" step="0.01" name="price" value="{{ product.price_per_kg }}" required
                        class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Stock (kg)</label>
                <input type="number" step="0.1" name="stocks" value="{{ product.stocks_kg }}" required
                    class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
                {% if product.image %}
                    <div class="mb-2">
                        <img src="{{ product.image.url }}" class="h-20 w-20 object-cover rounded-lg">
                    </div>
                {% endif %}
                <input type="file" name="image" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#f0fff4] file:text-[#7fad39] hover:file:bg-green-100">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Gallery Images</label>
                {% if product.gallery.all %}
                    <div class="flex flex-wrap gap-2 mb-2">
                        {% for img in product.gallery.all %}
                            <img src="{{ img.image.url }}" class="h-16 w-16 object-cover rounded-lg">
                        {% endfor %}
                    </div>
                {% endif %}
                <input type="file" name="images" multiple accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#f0fff4] file:text-[#7fad39] hover:file:bg-green-100">
                <p class="text-xs text-gray-400 mt-1">Add more photos to build buyer confidence.</p>
            </div>

            <div class="flex items-center justify-end space-x-4 pt-4 border-t">
                <a href="{% url 'users:seller_dashboard' %}" class="text-gray-600 hover:text-gray-800 font-medium">Cancel</a>
                <button type="submit" class="bg-[#7fad39] text-white px-6 py-2 rounded-lg font-bold hover:bg-[#6f962d] transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
