services:
  - type: web
    name: fishcurrent
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fishcurrent.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: fishcurrent-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: fishcurrent-db
    databaseName: fishcurrent
    user: fishcurrent
